name: Releaser

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c7a4512c54606c2b0940e9809cb3454a2cbdf4fa # v0.11.205
        with:
          version: 0.11.205

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Assemble final library and every native release binary
        run: bun run prepublishOnly

      - name: Verify final normally packed SDK and bundled tools
        id: sdk
        run: bun run test:sdk
        env:
          BETTER_DX_SDK_EVIDENCE: ${{ runner.temp }}/better-dx-sdk

      - name: Retain original qualified SDK and consumer evidence
        if: always() && steps.sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: better-dx-release-sdk
          path: |
            ${{ runner.temp }}/better-dx-sdk/**
            !${{ runner.temp }}/better-dx-sdk/**/node_modules/**
          if-no-files-found: error

      - name: Publish
        run: pantry publish --npm --access public --ignore-scripts
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: stacksjs/action-releaser@v1.2.11
        with:
          files: |
            bin/dx-linux-x64
            bin/dx-linux-arm64
            bin/dx-windows-x64.exe
            bin/dx-darwin-x64
            bin/dx-darwin-arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
