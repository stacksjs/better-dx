name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c7a4512c54606c2b0940e9809cb3454a2cbdf4fa # v0.11.205
        with:
          version: 0.11.205

      - name: Use cached node_modules
        uses: actions/cache@v5.0.4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c7a4512c54606c2b0940e9809cb3454a2cbdf4fa # v0.11.205
        with:
          version: 0.11.205

      - name: Use cached node_modules
        uses: actions/cache@v5.0.4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun --bun run typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c7a4512c54606c2b0940e9809cb3454a2cbdf4fa # v0.11.205
        with:
          version: 0.11.205

      - name: Use cached node_modules
        uses: actions/cache@v5.0.4
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Unit Test
        run: bun test

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c7a4512c54606c2b0940e9809cb3454a2cbdf4fa # v0.11.205
        with:
          version: 0.11.205
      - name: Install committed dependencies
        run: bun install --frozen-lockfile
      - name: Build library and CLI
        run: bun run build
      - name: Verify normally packed SDK and bundled tools
        id: sdk
        run: bun run test:sdk
        env:
          BETTER_DX_SDK_EVIDENCE: ${{ runner.temp }}/better-dx-sdk
      - name: Retain original SDK and consumer evidence
        if: always() && steps.sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: better-dx-sdk
          path: |
            ${{ runner.temp }}/better-dx-sdk/**
            !${{ runner.temp }}/better-dx-sdk/**/node_modules/**
          if-no-files-found: error

  publish-commit:
    needs: [lint, typecheck, test, sdk]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Pantry
        uses: pantry-pm/pantry/packages/action@c7a4512c54606c2b0940e9809cb3454a2cbdf4fa # v0.11.205
        with:
          version: 0.11.205

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify the final commit SDK and bundled tools
        id: sdk
        run: bun run test:sdk
        env:
          BETTER_DX_SDK_EVIDENCE: ${{ runner.temp }}/better-dx-sdk

      - name: Retain original commit SDK and consumer evidence
        if: always() && steps.sdk.outcome != 'skipped'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: better-dx-commit-sdk
          path: |
            ${{ runner.temp }}/better-dx-sdk/**
            !${{ runner.temp }}/better-dx-sdk/**/node_modules/**
          if-no-files-found: error

      - name: Publish Commit
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pantry publish:commit '.'
        env:
          PANTRY_REGISTRY_TOKEN: ${{ secrets.PANTRY_TOKEN }}
